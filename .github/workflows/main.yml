name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,   goos: linux,   goarch: amd64, ext: '' }
          - { name: linux-arm64,   goos: linux,   goarch: arm64, ext: '' }
          - { name: darwin-amd64,  goos: darwin,  goarch: amd64, ext: '' }
          - { name: darwin-arm64,  goos: darwin,  goarch: arm64, ext: '' }
          - { name: windows-amd64, goos: windows, goarch: amd64, ext: '.exe' }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Init Go module (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f go.mod ]; then
            go mod init "github.com/${GITHUB_REPOSITORY}"
          fi

      - name: Resolve deps
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/cuckoo-${{ matrix.name }}${{ matrix.ext }}"
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$out" .
          test -s "$out"

      - name: Smoke test (native linux/amd64 only)
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/cuckoo-linux-amd64 -h || true

      - uses: actions/upload-artifact@v4
        with:
          name: cuckoo-${{ matrix.name }}
          path: dist/cuckoo-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/* > dist/SHA256SUMS
          ls -la dist

      - name: Tag (manual runs)
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: EndBug/latest-tag@latest
        if: github.ref_type != 'tag'
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/cuckoo-*
            dist/SHA256SUMS
